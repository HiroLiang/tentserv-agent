[project]
name = "tentgent-workspace"
version = "0.1.0"
description = "Workspace metadata for Tentgent."
requires-python = ">=3.11,<3.13"
dependencies = [
    "starlette>=1.3.1",
]

[tool.uv]
package = false
# Security floors for transitive runtime dependencies; frozen installs use uv.lock.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "datasets>=5.0.1",
    "fsspec>=2026.6.0",
    "multidict>=6.9.1",
    "setuptools>=83.0.0",
    "urllib3>=2.8.0",
]

[tool.uv.workspace]
members = [
    "python/tentgent-model-runtime",
]

[tool.pyright]
include = [
    "python/tentgent-model-runtime/src",
]
extraPaths = [
    "python/tentgent-model-runtime/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.tentgent]
app_slug = "tentgent"
display_name = "Tentgent"
service_host = "agent.tentserv.com"
app_id = "com.tentserv.tentgent"
env_prefix = "TENTGENT"

[tool.tentgent.project_dirs]
qualifier = "com"
organization = "tentserv"
application = "tentgent"

[tool.tentgent.env]
home = "TENTGENT_HOME"
models = "TENTGENT_MODELS_DIR"
adapters = "TENTGENT_ADAPTERS_DIR"
datasets = "TENTGENT_DATASETS_DIR"
cache = "TENTGENT_CACHE_DIR"
runtime = "TENTGENT_RUNTIME_DIR"
logs = "TENTGENT_LOG_DIR"

[tool.tentgent.paths]
config_file = "config.toml"
models = "models"
adapters = "adapters"
datasets = "datasets"
cache = "cache"
runtime = "runtime"
logs = "logs"
locks = "locks"
socket = "runtime/tentgent.sock"
pid_file = "runtime/tentgent.pid"
